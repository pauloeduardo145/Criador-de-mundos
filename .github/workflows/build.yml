name: Build Multiplataforma

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CriadorDeMundos-windows
            asset_ext: .exe
          - os: ubuntu-latest
            artifact_name: CriadorDeMundos-linux
            asset_ext: ''
          - os: macos-latest
            artifact_name: CriadorDeMundos-macos
            asset_ext: .app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller --noconfirm --clean CriadorDeMundos.spec

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/CriadorDeMundos${{ matrix.asset_ext }}

  package-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar binário Linux gerado no job anterior
        uses: actions/download-artifact@v4
        with:
          name: CriadorDeMundos-linux
          path: dist

      - name: Preparar binário
        run: |
          chmod +x dist/CriadorDeMundos
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.0.1"; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Instalar fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Gerar pacote .deb
        run: |
          fpm -s dir -t deb \
            -n criadordemundos \
            -v "$VERSION" \
            --description "Criador de Mundos - ferramenta de worldbuilding" \
            --prefix /usr/local/bin \
            dist/CriadorDeMundos=criadordemundos

      - name: Gerar pacote .rpm
        run: |
          fpm -s dir -t rpm \
            -n criadordemundos \
            -v "$VERSION" \
            --description "Criador de Mundos - ferramenta de worldbuilding" \
            --prefix /usr/local/bin \
            dist/CriadorDeMundos=criadordemundos

      - name: Montar estrutura AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/CriadorDeMundos AppDir/usr/bin/criadordemundos
          cat > AppDir/criadordemundos.desktop <<EOF
          [Desktop Entry]
          Name=Criador de Mundos
          Exec=criadordemundos
          Icon=criadordemundos
          Type=Application
          Categories=Utility;
          EOF
          curl -s -o AppDir/criadordemundos.png https://raw.githubusercontent.com/AppImage/AppImageKit/master/resources/appimagetool.png

      - name: Baixar appimagetool
        run: |
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Gerar AppImage
        run: |
          ./appimagetool --appimage-extract-and-run AppDir CriadorDeMundos-x86_64.AppImage

      - name: Enviar pacotes Linux
        uses: actions/upload-artifact@v4
        with:
          name: CriadorDeMundos-linux-pacotes
          path: |
            *.deb
            *.rpm
            *.AppImage

  deploy-site:
    needs:
      - build
      - package-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Clonar site
        run: |
          git clone https://x-access-token:${{ secrets.SITE_TOKEN }}@github.com/pauloeduardo145/Create-of-World-s.git site

      - name: Copiar Windows
        run: |
          mkdir -p site/Windows
          find artifacts -name "*.exe" -exec cp {} site/Windows/CriadorDeMundos.exe \;

      - name: Copiar Linux
        run: |
          mkdir -p site/Linux
          find artifacts -name "*.AppImage" -exec cp {} site/Linux/CriadorDeMundos.AppImage \;
          find artifacts -name "*.deb" -exec cp {} site/Linux/ \;
          find artifacts -name "*.rpm" -exec cp {} site/Linux/ \;

      - name: Copiar Mac
        run: |
          mkdir -p site/Mac
          find artifacts -name "*.app" -maxdepth 3 -exec cp -r {} site/Mac/CriadorDeMundos.app \;

      - name: Criar latest.json
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cat <<EOF > site/latest.json
          {
            "version":"$VERSION",
            "downloads":{
                "windows":"/Windows/CriadorDeMundos.exe",
                "linux":"/Linux/CriadorDeMundos.AppImage",
                "mac":"/Mac/CriadorDeMundos.app"
            }
          }
          EOF

      - name: Commit
        run: |
          cd site
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Nova versão $GITHUB_REF_NAME" || echo "Nada para commitar"
          git push

  release:
    needs:
      - build
      - package-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            **/*.exe
            **/*.deb
            **/*.rpm
            **/*.AppImage