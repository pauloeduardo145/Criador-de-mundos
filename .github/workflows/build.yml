name: Build Multiplataforma

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CriadorDeMundos-windows
            asset_ext: .exe
          - os: ubuntu-latest
            artifact_name: CriadorDeMundos-linux
            asset_ext: ''
          - os: macos-latest
            artifact_name: CriadorDeMundos-macos
            asset_ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executável
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "CriadorDeMundos" main.py

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/CriadorDeMundos${{ matrix.asset_ext }}
